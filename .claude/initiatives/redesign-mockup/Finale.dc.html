<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Slutskærm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&amp;family=Nunito:wght@400;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#06140f}
a{color:#f2c14e}a:hover{color:#ffe08a}
</style>
</helmet>
<div style="width: 1600px; height: 900px; position: relative; overflow: hidden; font-family: Nunito, sans-serif; color: #fbf3e2; background-color: #07181a; background-image: radial-gradient(ellipse at 50% 110%, rgba(46,110,78,0.6), rgba(7,24,26,0) 60%);">

  <svg aria-hidden="true" width="1600" height="900" viewBox="0 0 1600 900" style="position: absolute; inset: 0;">
    <sc-for list="{{bursts}}" as="b" hint-placeholder-count="5">
      <path d="{{b.d}}" fill="none" stroke="{{b.c}}" stroke-width="3" stroke-linecap="round" opacity="0.9"></path>
    </sc-for>
  </svg>
  <sc-for list="{{flakes}}" as="f" hint-placeholder-count="40">
    <div aria-hidden="true" style="position: absolute; left: {{f.x}}px; top: {{f.y}}px; width: {{f.s}}px; height: {{f.s}}px; border-radius: 50%; background: #ffffff; opacity: {{f.o}};"></div>
  </sc-for>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: #0e2c22; border-radius: 50% 50% 0 0 / 60px 60px 0 0; box-shadow: 0 -2px 0 rgba(251,243,226,0.15);"></div>
  <div aria-hidden="true" style="position: absolute; left: -40px; right: -40px; bottom: 0; height: 70px; background: #f6ecd9; opacity: 0.92; border-radius: 50% 50% 0 0 / 40px 40px 0 0;"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 70px; box-sizing: border-box;">
    <span style="font-size: 18px; font-weight: 900; letter-spacing: 0.32em; text-transform: uppercase; color: #f2c14e;">Alle 24 låger er åbnet</span>
    <h1 style="margin: 4px 0 0; font-family: 'Mountains of Christmas', serif; font-weight: 700; font-size: 120px; line-height: 1; text-shadow: 0 6px 0 #04100b, 0 0 50px rgba(242,193,78,0.35);">Hold 1 vinder!</h1>

    <div style="margin-top: 70px; display: flex; align-items: flex-end; gap: 90px;">

      <button type="button" aria-label="Hold 1: 1.240 point, vinder" style="all: unset; cursor: pointer; position: relative; width: 440px; transform: rotate(-2deg);">
        <svg aria-hidden="true" width="120" height="70" viewBox="0 0 120 70" style="position: absolute; left: 160px; top: -62px;">
          <path d="M10 62 L4 14 L34 38 L60 4 L86 38 L116 14 L110 62 Z" fill="#f2c14e" stroke="#b8871c" stroke-width="3" stroke-linejoin="round"></path>
          <circle cx="60" cy="44" r="7" fill="#d2393f"></circle>
        </svg>
        <div style="position: relative; background: #f6ecd9; color: #12372a; border-radius: 26px; padding: 26px 34px 28px; box-shadow: 0 8px 0 #cbb48c, 0 0 0 4px #f2c14e, 0 0 60px rgba(242,193,78,0.45); display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <div aria-hidden="true" style="position: absolute; inset: 10px; border: 3px dashed rgba(210,57,63,0.5); border-radius: 18px;"></div>
          <span style="font-weight: 900; font-size: 30px; letter-spacing: 0.1em; text-transform: uppercase; color: #b3262e;">Hold 1</span>
          <span style="font-family: 'Mountains of Christmas', serif; font-weight: 700; font-size: 132px; line-height: 0.9;">1.240</span>
          <span style="font-size: 20px; font-weight: 800; color: #5d6e5f;">point · 12 låger</span>
        </div>
      </button>

      <button type="button" aria-label="Hold 2: 985 point" style="all: unset; cursor: pointer; position: relative; width: 400px; transform: rotate(2deg); margin-bottom: 10px;">
        <div style="position: relative; background: #f6ecd9; color: #12372a; border-radius: 26px; padding: 22px 30px 24px; box-shadow: 0 8px 0 #cbb48c, 0 20px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <div aria-hidden="true" style="position: absolute; inset: 10px; border: 3px dashed rgba(196,140,20,0.6); border-radius: 18px;"></div>
          <span style="font-weight: 900; font-size: 28px; letter-spacing: 0.1em; text-transform: uppercase; color: #8a5d00;">Hold 2</span>
          <span style="font-family: 'Mountains of Christmas', serif; font-weight: 700; font-size: 112px; line-height: 0.9;">985</span>
          <span style="font-size: 20px; font-weight: 800; color: #5d6e5f;">point · 11 låger</span>
        </div>
      </button>
    </div>

    <p style="margin: 56px 0 0; font-family: 'Mountains of Christmas', serif; font-weight: 700; font-size: 44px; color: #f2c14e;">Glædelig jul!</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const spots = [[230, 210, '#ff5a5f', 90], [1370, 190, '#f2c14e', 110], [430, 480, '#7cc6ff', 60], [1210, 470, '#7bd389', 70], [800, 120, '#fbf3e2', 50], [110, 620, '#f2c14e', 50], [1500, 600, '#ff5a5f', 55]];
    const bursts = spots.map(([cx, cy, c, r]) => {
      let d = '';
      const n = 14;
      for (let k = 0; k < n; k++) {
        const a = (k / n) * Math.PI * 2;
        const x1 = cx + Math.cos(a) * r * 0.35, y1 = cy + Math.sin(a) * r * 0.35;
        const x2 = cx + Math.cos(a) * r, y2 = cy + Math.sin(a) * r;
        d += 'M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' L' + x2.toFixed(1) + ' ' + y2.toFixed(1) + ' ';
      }
      return { d, c };
    });
    const flakes = [];
    for (let k = 0; k < 40; k++) {
      flakes.push({ x: (k * 271) % 1600, y: (k * 149 + 30) % 780, s: 2 + (k % 3), o: (0.1 + (k % 5) * 0.08).toFixed(2) });
    }
    return { bursts, flakes };
  }
}
</script>
</body>
</html>
