<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Åben låge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&amp;family=Nunito:wght@400;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#081a14}
a{color:#b3262e}a:hover{color:#7d1a20}
</style>
</helmet>
<div style="width: 1600px; height: 900px; position: relative; overflow: hidden; font-family: Nunito, sans-serif; color: #12372a; background-color: #0e2c22; background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0 2px, rgba(0,0,0,0) 2px 14px), repeating-linear-gradient(-45deg, rgba(255,255,255,0.025) 0 2px, rgba(0,0,0,0) 2px 14px);">

  <div aria-hidden="true" style="position: absolute; inset: 250px 70px 60px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 18px; opacity: 0.18; filter: blur(3px);">
    <sc-for list="{{ghosts}}" as="g" hint-placeholder-count="24">
      <div style="border-radius: 16px; background: #f6ecd9;"></div>
    </sc-for>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(4,14,10,0.55);"></div>

  <div role="dialog" aria-label="Låge 7" style="position: absolute; left: 110px; top: 90px; width: 1380px; height: 760px; box-sizing: border-box; border-radius: 30px; background: #f6ecd9; background-image: radial-gradient(rgba(179,38,46,0.06) 1.5px, rgba(0,0,0,0) 1.6px); background-size: 22px 22px; box-shadow: 0 10px 0 #cbb48c, 0 40px 80px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; padding: 0 70px 44px;">
    <div aria-hidden="true" style="position: absolute; inset: 14px; border: 3px dashed rgba(179,38,46,0.35); border-radius: 20px; pointer-events: none;"></div>

    <svg aria-hidden="true" width="120" height="90" viewBox="0 0 120 90" style="position: absolute; left: 26px; top: 22px;">
      <path d="M58 48 C 40 20, 18 26, 6 14 C 14 30, 10 40, 22 50 C 30 46, 40 54, 58 48 Z" fill="#2f7a4f" stroke="#1d5537" stroke-width="2"></path>
      <path d="M62 48 C 76 18, 100 22, 114 12 C 106 28, 112 40, 98 50 C 90 46, 80 56, 62 48 Z" fill="#3a8c5c" stroke="#1d5537" stroke-width="2"></path>
      <circle cx="54" cy="56" r="9" fill="#d2393f"></circle>
      <circle cx="68" cy="56" r="9" fill="#d2393f"></circle>
      <circle cx="61" cy="68" r="9" fill="#b3262e"></circle>
      <circle cx="51" cy="53" r="2.5" fill="#ffd9d9"></circle>
    </svg>

    <button type="button" aria-label="Luk lågen" style="all: unset; cursor: pointer; position: absolute; right: 34px; top: 30px; width: 52px; height: 52px; border-radius: 50%; background: rgba(18,55,42,0.08); display: flex; align-items: center; justify-content: center;">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22"><path d="M4 4 L18 18 M18 4 L4 18" stroke="#12372a" stroke-width="3" stroke-linecap="round"></path></svg>
    </button>

    <div style="position: relative; margin-top: -2px; display: flex; align-items: flex-start;">
      <div aria-hidden="true" style="width: 46px; height: 64px; margin-top: 18px; margin-right: -14px; background: #8f1d24; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 34% 50%);"></div>
      <h2 style="position: relative; margin: 0; padding: 10px 56px 14px; background: #d2393f; color: #fff7ea; font-family: 'Mountains of Christmas', serif; font-weight: 700; font-size: 66px; line-height: 1; border-radius: 0 0 18px 18px; box-shadow: 0 6px 0 #8f1d24;">Låge 7</h2>
      <div aria-hidden="true" style="width: 46px; height: 64px; margin-top: 18px; margin-left: -14px; background: #8f1d24; clip-path: polygon(0 0, 100% 0, 66% 50%, 100% 100%, 0 100%);"></div>
    </div>

    <main style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; max-width: 1000px;">
      <sc-if value="{{asking}}" hint-placeholder-val="{{true}}">
        <span style="font-size: 18px; font-weight: 900; letter-spacing: 0.24em; text-transform: uppercase; color: #b3262e;">Spørgsmål</span>
        <p style="margin: 0; font-size: 64px; font-weight: 800; line-height: 1.15;">Danser man om juletræet i Belgien?</p>
      </sc-if>
      <sc-if value="{{revealed}}" hint-placeholder-val="{{false}}">
        <span style="font-size: 18px; font-weight: 900; letter-spacing: 0.24em; text-transform: uppercase; color: #b3262e;">Svar</span>
        <p style="margin: 0; font-family: 'Mountains of Christmas', serif; font-weight: 700; font-size: 130px; line-height: 0.9; color: #b3262e;">Nej</p>
        <p style="margin: 0; font-size: 34px; line-height: 1.35; color: #2c4a3d;">At danse om juletræet er en skandinavisk tradition, som mest dyrkes i Danmark.</p>
      </sc-if>
    </main>

    <footer style="width: 100%; display: flex; justify-content: center; align-items: center; gap: 24px; min-height: 84px;">
      <sc-if value="{{asking}}" hint-placeholder-val="{{true}}">
        <button type="button" onClick="{{reveal}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 18px 34px; border-radius: 99px; background: #12372a; color: #fbf3e2; font-size: 26px; font-weight: 900; box-shadow: 0 6px 0 #071a13;">
          Vis svaret
          <span style="font-size: 15px; font-weight: 800; padding: 3px 10px; border-radius: 8px; border: 2px solid rgba(251,243,226,0.4);">Enter</span>
        </button>
      </sc-if>
      <sc-if value="{{revealed}}" hint-placeholder-val="{{false}}">
        <button type="button" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 16px 30px; border-radius: 99px; background: #d2393f; color: #fff7ea; font-size: 28px; font-weight: 900; box-shadow: 0 6px 0 #8f1d24; min-width: 230px; justify-content: center;">
          <span style="font-size: 15px; font-weight: 800; padding: 3px 10px; border-radius: 8px; border: 2px solid rgba(255,247,234,0.5);">1</span>
          Hold 1
        </button>
        <button type="button" onClick="{{back}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 16px 26px; border-radius: 99px; background: rgba(18,55,42,0.1); color: #2c4a3d; font-size: 22px; font-weight: 800;">
          <span style="font-size: 14px; font-weight: 800; padding: 3px 9px; border-radius: 8px; border: 2px solid rgba(44,74,61,0.35);">Q</span>
          Ingen fik den
        </button>
        <button type="button" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 16px 30px; border-radius: 99px; background: #f2c14e; color: #3b2a05; font-size: 28px; font-weight: 900; box-shadow: 0 6px 0 #b8871c; min-width: 230px; justify-content: center;">
          Hold 2
          <span style="font-size: 15px; font-weight: 800; padding: 3px 10px; border-radius: 8px; border: 2px solid rgba(59,42,5,0.4);">2</span>
        </button>
      </sc-if>
    </footer>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const revealed = !!(this.state && this.state.revealed);
    const ghosts = [];
    for (let i = 0; i < 24; i++) ghosts.push({ i });
    return {
      ghosts,
      asking: !revealed,
      revealed,
      reveal: () => this.setState({ revealed: true }),
      back: () => this.setState({ revealed: false })
    };
  }
}
</script>
</body>
</html>
